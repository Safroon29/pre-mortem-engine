spring.application.name=pre-mortem-engine-workspace-2026
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/premortem_engine_workspace_2026?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:""}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

# Project analysis upload guardrails
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
