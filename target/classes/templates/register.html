<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | Pre-Mortem Engine</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><main class="auth-card"><a class="brand" th:href="@{/login}"><span class="brand-mark">P</span> Pre-Mortem <b>Engine</b></a><div class="eyebrow">START WITH FORESIGHT</div><h1>Create your account</h1><p class="muted">Keep your project risks and mitigation plans in one place.</p>
<div class="notice error" th:if="${error}" th:text="${error}"></div><form th:action="@{/register}" method="post" class="stack"><label>Full name<input name="displayName" required maxlength="80" th:value="${displayName}"></label><label>Email address<input type="email" name="email" required maxlength="120" th:value="${email}"></label><label>Password <span class="muted small">(at least 8 characters)</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label><button class="btn primary full" type="submit">Create account</button></form><p class="auth-foot">Already registered? <a th:href="@{/login}">Sign in</a></p></main></body></html>
